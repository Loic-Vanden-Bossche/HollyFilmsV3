services:
  jellyfin:
    image: jellyfin/jellyfin:12.4
    ports:
      - '127.0.0.1:8096:8096'
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./media:/media:ro

  postgres:
    image: postgres:17.12-alpine
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: hollyfilms
      POSTGRES_DB: hollyfilms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hollyfilms-local}
    volumes:
      - hollyfilms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hollyfilms -d hollyfilms']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  jellyfin-config:
  jellyfin-cache:
  hollyfilms-postgres:
